version: 2
updates:
  # No Cargo.lock is committed (commons is a library), so these PRs move
  # the manifest's minimum versions; the grouped PR keeps them to one a week.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # parking_lot 0.13 needs Rust 1.95, above the 1.89 MSRV, and only the
      # logging module (deprecated in 0.0.8, pending removal) uses it.
      - dependency-name: "parking_lot"
        versions: [">=0.13"]
    commit-message:
      prefix: "chore(deps)"
  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
