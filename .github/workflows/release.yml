name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  # Lets an existing tag be re-released without deleting and re-pushing
  # it. A GitHub Actions outage once left a tag-triggered run wedged --
  # reported as queued, completed and running at the same time, and
  # refusing both cancel and rerun -- with no way to retry short of
  # moving the tag. Moving tags to work around infrastructure is how
  # releases get published from the wrong commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.0.4"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      # On a dispatch, github.ref is the branch the workflow was started
      # from, not the tag. Checking out the tag explicitly means the
      # version that is validated is the version that gets published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag matches Cargo.toml version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Read the version from cargo itself rather than grepping a
          # manifest. The root Cargo.toml is a virtual workspace with no
          # version field, so grepping it yielded an empty string and the
          # check compared the tag against "v".
          CARGO_VERSION="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "euxis-commons") | .version')"
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Tag ${TAG} matches Cargo.toml version ${CARGO_VERSION}"

  # Tests and supply-chain checks on the exact tag, in a job with no
  # id-token permission: dependency build scripts run here, so they never
  # share a job with the credential that can publish.
  verify:
    name: Verify Tag
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - name: Test
        run: cargo test --workspace --all-features
      - name: Audit and deny
        run: |
          cargo audit
          cargo deny check

  publish:
    name: Publish to Crates.io
    needs: [validate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token crates.io exchanges for a publish token.
      id-token: write
    steps:
      # Same tag as validate. Without this a dispatch would package
      # whatever is on the default branch under the tag's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # No rust-cache here: a cache restored into the job that holds
      # id-token: write would let a poisoned cache reach the publish.
      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. Needs a trusted publisher on crates.io for this
      # crate (repo + release.yml).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # -p is required: the workspace root is virtual, so a bare
        # `cargo publish` cannot infer which package to publish.
        run: cargo publish -p euxis-commons
