name: 🚀 Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          # Read the version from cargo itself rather than grepping a
          # manifest. The root Cargo.toml is a virtual workspace with no
          # version field, so grepping it yielded an empty string and the
          # check compared the tag against "v".
          CARGO_VERSION="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "euxis-commons") | .version')"
          TAG="${GITHUB_REF_NAME}"
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Tag ${TAG} matches Cargo.toml version ${CARGO_VERSION}"

  publish:
    name: Publish to Crates.io
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token crates.io exchanges for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. Needs a trusted publisher on crates.io for this
      # crate (repo + release.yml).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # -p is required: the workspace root is virtual, so a bare
        # `cargo publish` cannot infer which package to publish.
        run: cargo publish -p euxis-commons
