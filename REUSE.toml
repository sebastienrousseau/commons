# REUSE 3.3 annotations: blanket licensing for files that do not carry
# an inline SPDX header (config, fixtures, generated artefacts). Rust
# source files keep their inline SPDX headers — this file only fills in
# the gaps.
#
# Documented at https://reuse.software/spec-3.3/

version = 1

# ── Project meta / config files ───────────────────────────────────
[[annotations]]
path = [
    ".gitignore",
    "rustfmt.toml",
    "Cargo.toml",
    "Cargo.lock",
    "Makefile",
    "deny.toml",
    "REUSE.toml",
    ".cargo/config.toml",
    "crates/commons/Cargo.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastian Rousseau"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── CI workflows ──────────────────────────────────────────────────
[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastian Rousseau"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Documentation ─────────────────────────────────────────────────
[[annotations]]
path = [
    "README.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "SECURITY.md",
    "SUPPORT.md",
    "doc/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastian Rousseau"
SPDX-License-Identifier = "MIT OR Apache-2.0"
