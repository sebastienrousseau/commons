[workspace]
resolver = "2"
members = ["crates/commons"]

# Single-member workspace, matching the layout used across the
# ecosystem: the crate lives under `crates/<name>/` so that satellite
# crates can be added later without moving the primary one again.
#
# Shared build profiles live here rather than in the member manifest --
# Cargo only honours `[profile.*]` at the workspace root, and silently
# ignores it elsewhere.

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true
panic = "unwind"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
